name = "zkcashModel"
defaultTargets = ["code_model", "Spec", "proofs"]

# Aeneas Lean backend library (`import Aeneas`), pinned to the exact revision that
# generated lean/code_model/generated (formal-verification/flake.lock).
# It transitively requires Mathlib v4.31.0, which Common/Bn254.lean and Spec/ both use.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "a827e6fba15f4b4c8fb5d0a786fd60f4ef1feeb8"
subDir = "backends/lean"

# Explicit module lists (not "Prefix.*"): the *_Template.lean files are Aeneas
# scaffolding meant to be renamed to *External.lean, not compiled, so they are
# deliberately excluded from every library.
# The model, generated by ../extract.sh: ONE charon run with every entry point as a root and
# ONE aeneas run, so each function is emitted exactly once. This replaced an earlier split
# into three per-entry-point libraries (TransactShim / VerifyProofShim / CheckPublicAmountShim),
# which emitted the shared functions into more than one library and so could not be imported
# together -- see MODEL_COVERAGE.md.
[[lean_lib]]
name = "code_model"
globs = [
  # hand-written: the trusted base. Nothing here is generated.
  "code_model.hand_written.Bn254", "code_model.hand_written.FrShim", "code_model.hand_written.Curve",
  "code_model.hand_written.TrustedTypes", "code_model.hand_written.TrustedFuns",
  "code_model.hand_written.SyscallContracts",
  # generated by aeneas, plus two forwarders whose module names the tool fixes.
  "code_model.generated.Types", "code_model.generated.Funs",
  "code_model.generated.TypesExternal", "code_model.generated.FunsExternal",
]

# Hand-written specification of the protocol. Independent of the model: imports none of it.
# Kept outside the aeneas-regenerated subdirs so `extract.sh` never touches it.
[[lean_lib]]
name = "Spec"
globs = ["Spec.privacy_cash_spec", "Spec.theorems"]

# Hand-written proofs ABOUT the model. Imports code_model; never imported by it, and never
# touched by extract.sh.
[[lean_lib]]
name = "proofs"
globs = ["proofs.VerifyProof.CopyLoops", "proofs.VerifyProof.Accumulate", "proofs.VerifyProof.Main"]
