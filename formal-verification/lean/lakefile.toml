name = "zkcashModel"
defaultTargets = ["Spec", "Connection"]

# The code model is core-model (../core-model): it is the only Aeneas user, and it brings
# Aeneas and Mathlib (the spec needs only Mathlib, at the same revision).
# The old fv_* model (code_model/) and its verifier proofs (proofs/) are superseded by
# core-model and no longer build on its Aeneas revision, so they are not built here.
[[require]]
name = "privacy_cash"
path = "../core-model"

# Hand-written specification of the protocol. Independent of the model: imports none of it.
[[lean_lib]]
name = "Spec"
globs = ["Spec.Spec", "Spec.Vocabulary", "Spec.Proofs", "Spec.NonVacuity", "Spec.Statements",
  "Spec.Axioms", "Spec.privacy_cash_spec", "Spec.theorems"]

# Connection theorems: the code model (core-model) satisfies the spec.
[[lean_lib]]
name = "Connection"
leanOptions = { autoImplicit = false }
