name = "zkcashModel"
defaultTargets = ["Common", "Zkcash", "Test", "Spec"]

# Aeneas Lean backend library (`import Aeneas`), pinned to the exact revision that
# generated lean/Zkcash (formal-verification/flake.lock).
# It transitively requires Mathlib v4.31.0, which is what Test/Test.lean imports.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "a827e6fba15f4b4c8fb5d0a786fd60f4ef1feeb8"
subDir = "backends/lean"

# Explicit module lists (not "Prefix.*"): the *_Template.lean files are Aeneas
# scaffolding meant to be renamed to *External.lean, not compiled, so they are
# deliberately excluded from every library.
# Hand-owned trusted base shared by all three models. NOT generated by aeneas, and not
# touched by extract.sh. Declares bn254_r / FrShim / G1Shim and the curve surface ONCE
# instead of once per model, so the models share one trusted base -- in particular one
# G1Shim type, not unrelated copies. It does NOT let the models be imported together:
# their generated code overlaps. See Test/CommonBase.lean.
[[lean_lib]]
name = "Common"
globs = ["Common.Bn254", "Common.FrShim", "Common.Curve"]

# The model, generated by ../extract.sh: ONE charon run with every entry point as a root and
# ONE aeneas run, so each function is emitted exactly once. This replaced an earlier split
# into three per-entry-point libraries (TransactShim / VerifyProofShim / CheckPublicAmountShim),
# which emitted the shared functions into more than one library and so could not be imported
# together -- see Test/CommonBase.lean.
[[lean_lib]]
name = "Zkcash"
globs = ["Zkcash.Types", "Zkcash.TypesExternal", "Zkcash.Funs", "Zkcash.FunsExternal"]

[[lean_lib]]
name = "Test"
globs = ["Test.Test", "Test.CommonBase"]

# Hand-written specification of the protocol, and proofs about the extracted model.
# Kept outside the aeneas-regenerated subdirs so `extract.sh` never touches it.
[[lean_lib]]
name = "Spec"
globs = ["Spec.privacy_cash_spec", "Spec.theorems"]
